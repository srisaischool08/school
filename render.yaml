services:
  - type: web
    name: srisai-model-school
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build && npm run prisma:generate
    startCommand: npm run start:render
    healthCheckPath: /api/health
    disk:
      name: srisai-school-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/srisai.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: School Administrator
